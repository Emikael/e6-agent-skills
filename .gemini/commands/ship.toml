description = "Assess release readiness, resolve blockers, and ship only within existing authorization."

prompt = """
Use e6-shipping-and-launch with e6-caveman. Read the actual diff, requirements, verification evidence, project release rules, and existing authorization.

1. Confirm acceptance, tests, real local runtime behavior, relevant docs, and Definition of Done. Required checks without evidence remain blockers.
2. Use targeted review perspectives where risk warrants them: code-reviewer, security-auditor, and test-engineer, plus web-performance-auditor for web-facing changes when performance risk applies. Delegate only independent substantial work, with packets and returns per the workflow contract's delegation rules. Keep one coordinator. If delegation is unavailable, perform appropriate passes sequentially and report that accurately.
3. Merge findings by evidence, deduplicate, and fix Critical/Required issues. Map persona severities with the workflow contract's Finding Severity table (security Critical/High become blocking Critical/Required); evaluate lower severities against acceptance and project policy. Rerun affected checks. Verify release-specific configuration, migrations, telemetry, and accessibility when relevant.
4. Prepare real rollback/recovery steps, measurable triggers, owners, and known irreversible boundaries. Do not invent database rollback commands or promise reversal of deleted data.
5. Report GO, NO-GO, or HOLD in the skill's ship-report format, with blockers, evidence, acknowledged risks, and the rollback/recovery plan. Link detailed reports instead of copying them all into the chat.
6. If release is authorized, follow the project's actual staged release procedure and monitor its signals. If authorization is missing, complete the reviewable release preparation, name the exact pending action, and request that approval. Routine local checks need no new approval.
"""
